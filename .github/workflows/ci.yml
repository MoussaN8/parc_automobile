name: Odoo CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-syntax:
    name: Code Linting & Syntax Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Check Python Syntax Errors
      run: |
        # Bloque le pipeline s'il y a des erreurs de syntaxe Python critique
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Code Style Check
      run: |
        # Vérifie les normes de code sans bloquer le pipeline
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics